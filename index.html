const defaultTexts={
 A:{title:'Teks A — Sistem Pengelolaan Air Hujan di Kota',body:`Di sejumlah kota, air hujan yang dahulu meresap ke tanah kini lebih sering mengalir cepat menuju saluran drainase. Perubahan ini berkaitan dengan bertambahnya permukaan kedap air, seperti aspal, beton, dan atap bangunan. Ketika air tidak dapat masuk ke tanah, debit limpasan meningkat dalam waktu singkat. Saluran yang dirancang untuk kondisi lama dapat kewalahan, terutama saat hujan deras berlangsung bersamaan dengan pasang sungai atau tingginya muka air di hilir.

Salah satu pendekatan yang berkembang adalah pengelolaan air hujan terdesentralisasi. Alih-alih mengandalkan satu saluran besar untuk memindahkan air secepat mungkin, pendekatan ini menahan, menyerap, atau memperlambat air di banyak titik. Taman resapan, parit bervegetasi, sumur infiltrasi, dan atap hijau merupakan contoh fasilitas yang dapat diterapkan sesuai kondisi setempat. Fasilitas tersebut tidak selalu menggantikan drainase konvensional, tetapi dapat mengurangi beban puncak yang diterima jaringan utama.

Taman resapan biasanya memiliki permukaan yang sedikit lebih rendah daripada area sekitarnya. Air dari trotoar atau atap dialirkan ke area ini, kemudian tertahan sementara dan meresap melalui lapisan tanah. Tanaman dipilih bukan hanya karena penampilannya, melainkan juga karena mampu bertahan menghadapi kondisi basah dan kering yang bergantian. Desain perlu mempertimbangkan jenis tanah, kedalaman muka air tanah, serta jarak dari fondasi bangunan. Tanah liat yang padat, misalnya, menyerap air lebih lambat daripada tanah berpasir, sehingga mungkin memerlukan rancangan yang berbeda.

Parit bervegetasi adalah saluran dangkal yang ditanami rumput atau tumbuhan lain. Berbeda dari saluran beton yang licin, vegetasi dan permukaan tanah memperlambat aliran serta membantu menyaring sebagian sedimen. Parit seperti ini dapat ditempatkan di tepi jalan, area parkir, atau jalur pejalan kaki yang cukup lebar. Namun, kemiringan dan kapasitasnya harus dirancang dengan cermat. Jika aliran terlalu deras, tanah dapat terkikis; jika pemeliharaan diabaikan, sampah dan endapan dapat mengurangi kemampuan menyalurkan air.

Atap hijau menempatkan lapisan media tumbuh dan tanaman di atas struktur atap yang telah diperkuat dan dilengkapi sistem kedap air. Lapisan tersebut menahan sebagian hujan, lalu melepaskan air secara bertahap melalui penguapan dan drainase. Manfaatnya dipengaruhi oleh kedalaman media, jenis tanaman, kemiringan atap, dan kondisi cuaca sebelumnya. Atap hijau yang telah jenuh akibat hujan berulang tentu memiliki ruang tampung lebih sedikit daripada atap yang sempat mengering. Karena bobot media basah dapat besar, pemeriksaan struktur bangunan merupakan prasyarat penting.

Selain fasilitas fisik, pengelolaan air hujan membutuhkan data. Pengukur hujan menunjukkan jumlah air yang jatuh di suatu lokasi, sedangkan sensor muka air membantu mengamati respons saluran. Data dari beberapa titik dapat memperlihatkan bagian jaringan yang paling cepat penuh. Meski demikian, sensor tidak otomatis menghasilkan keputusan yang tepat. Perangkat perlu dirawat, pembacaannya diperiksa, dan hasilnya dipadukan dengan catatan lapangan. Gangguan komunikasi atau alat yang bergeser dapat menghasilkan data yang tampak meyakinkan tetapi keliru.

Perencanaan juga perlu memperhatikan siapa yang memperoleh manfaat dan siapa yang menanggung biaya. Ruang resapan yang dibangun hanya di kawasan tertentu mungkin mengurangi genangan di sana, tetapi tidak selalu menyelesaikan masalah di wilayah hilir. Pemerintah kota, pemilik bangunan, pengelola kawasan, dan warga perlu memahami pembagian tanggung jawab. Insentif untuk memasang fasilitas di lahan privat dapat membantu, tetapi harus disertai standar teknis dan pemantauan agar manfaatnya tidak sekadar diasumsikan.

Pemeliharaan sering kali menentukan keberhasilan jangka panjang. Daun yang menyumbat lubang masuk, sedimen yang menumpuk, tanaman yang mati, atau lapisan media yang memadat dapat menurunkan kinerja fasilitas. Karena itu, rancangan sebaiknya memasukkan akses untuk pemeriksaan dan jadwal perawatan sejak awal. Catatan sederhana mengenai kapan fasilitas dibersihkan dan bagaimana air mengalir setelah hujan dapat membantu mendeteksi perubahan kinerja.

Penilaian kinerja dapat dilakukan dengan membandingkan kondisi sebelum dan sesudah fasilitas dibangun. Pengamatan sebaiknya mencakup beberapa kejadian hujan, sebab satu kejadian saja belum tentu mewakili variasi musim. Catatan mengenai kedalaman genangan, lama air surut, dan lokasi luapan dapat memberi gambaran yang lebih berguna daripada kesan umum. Pengukuran tetap perlu dilakukan dengan cara yang konsisten agar perbedaan hasil tidak semata-mata disebabkan oleh metode pencatatan.

Tidak ada satu solusi yang cocok untuk seluruh kota. Kawasan dengan ruang terbuka luas mungkin dapat menggunakan taman resapan, sementara kawasan padat membutuhkan kombinasi atap hijau, tangki penampung, dan perbaikan saluran. Risiko banjir juga dipengaruhi bentuk wilayah, kondisi sungai, perubahan iklim, dan tata guna lahan. Pendekatan yang paling masuk akal biasanya menggabungkan infrastruktur, data, perawatan, serta koordinasi antarpihak. Tujuannya bukan menjanjikan bahwa genangan akan hilang sepenuhnya, melainkan mengurangi risiko dan membuat sistem kota lebih mampu menghadapi hujan yang bervariasi.`},
 B:{title:'Teks B — Perpustakaan Benih dan Ketahanan Tanaman',body:`Perpustakaan benih adalah tempat penyimpanan dan pengelolaan benih tanaman untuk menjaga keragaman genetik serta menyediakan bahan tanam bagi penelitian, pendidikan, dan pertanian. Berbeda dari perpustakaan buku, koleksinya merupakan bahan biologis yang dapat kehilangan daya tumbuh jika disimpan dalam kondisi yang tidak sesuai. Karena itu, pencatatan asal, kondisi penyimpanan, dan hasil pengujian menjadi bagian penting dari pengelolaan koleksi.

Keragaman genetik membantu populasi tanaman menghadapi perubahan lingkungan. Dalam satu jenis tanaman, individu dapat memiliki perbedaan dalam kebutuhan air, toleransi terhadap suhu, waktu berbunga, atau ketahanan terhadap organisme pengganggu. Jika semua tanaman memiliki sifat yang sangat seragam, satu tekanan lingkungan dapat berdampak luas. Sebaliknya, keragaman menyediakan kemungkinan bahwa sebagian individu memiliki ciri yang lebih sesuai dengan kondisi baru. Hal ini tidak berarti setiap varietas lokal selalu unggul, melainkan bahwa variasi dapat menjadi sumber pilihan bagi pemuliaan dan adaptasi.

Benih tidak semuanya dapat disimpan dengan cara yang sama. Banyak benih tanaman pangan dapat dikeringkan hingga kadar air rendah dan disimpan pada suhu dingin. Benih semacam ini sering disebut benih ortodoks. Sebagian spesies lain memiliki benih yang peka terhadap pengeringan atau suhu rendah; benih tersebut memerlukan pendekatan penyimpanan berbeda dan mungkin tidak dapat bertahan lama dalam fasilitas biasa. Karena karakter tiap spesies bervariasi, protokol penyimpanan harus didasarkan pada pengetahuan biologis, bukan satu aturan untuk seluruh koleksi.

Sebelum disimpan, sampel biasanya dibersihkan dan diperiksa. Bahan asing, benih rusak, atau tanda serangan organisme perlu dicatat. Pengeringan dilakukan secara terkendali agar benih mencapai kondisi yang sesuai tanpa merusak embrio. Setelah itu, benih dikemas dalam wadah yang membatasi pertukaran uap air dan diberi identitas yang dapat ditelusuri. Label yang hanya memuat nama umum sering tidak cukup, karena satu nama dapat digunakan untuk beberapa varietas atau kelompok lokal yang berbeda.

Informasi asal merupakan bagian dari nilai koleksi. Catatan dapat mencakup lokasi pengumpulan, tanggal, habitat, nama pengumpul, dan keadaan tanaman induk. Data tersebut membantu pengguna memahami konteks bahan yang disimpan. Namun, dokumentasi juga memiliki dimensi sosial. Pengetahuan mengenai benih dapat berasal dari komunitas petani yang telah menyeleksi dan memelihara tanaman selama banyak generasi. Pengumpulan bahan dan pemanfaatannya perlu mempertimbangkan persetujuan, aturan akses, serta pembagian manfaat yang adil.

Daya kecambah tidak dapat dipastikan hanya dari penampilan luar. Pengujian mengambil sebagian benih dari sampel untuk melihat berapa banyak yang mampu tumbuh dalam kondisi yang ditetapkan. Hasilnya menjadi perkiraan, bukan jaminan bahwa setiap benih akan tumbuh di lahan. Suhu, kelembapan, kedalaman tanam, kualitas tanah, dan organisme pengganggu turut memengaruhi keberhasilan di lapangan. Pengujian berkala dapat menunjukkan apakah suatu lot mulai kehilangan viabilitas dan perlu diperbanyak atau ditangani lebih lanjut.

Penyimpanan jangka panjang juga membutuhkan strategi regenerasi. Ketika jumlah benih yang hidup berkurang, sebagian koleksi dapat ditanam untuk menghasilkan benih baru. Proses ini tidak sederhana: tanaman perlu tumbuh dalam kondisi yang sesuai, penyerbukan harus dikelola, dan pencampuran dengan varietas lain perlu dicegah jika identitas genetik hendak dipertahankan. Regenerasi yang terlalu sering dapat meningkatkan biaya dan risiko perubahan komposisi genetik, sedangkan regenerasi yang terlambat dapat membuat koleksi tidak lagi dapat diperbanyak.

Fasilitas penyimpanan yang baik memantau suhu dan kelembapan, menyediakan sumber daya cadangan, serta memiliki prosedur saat alat mengalami gangguan. Sensor membantu menunjukkan perubahan kondisi, tetapi pembacaan harus diperiksa dan dicatat. Wadah yang rusak, pintu yang sering terbuka, atau pemadaman listrik berkepanjangan dapat memengaruhi sebagian koleksi. Karena itu, pencatatan insiden dan pemeriksaan fisik tetap diperlukan meskipun fasilitas menggunakan sistem pemantauan otomatis.

Koleksi benih juga memerlukan sistem informasi yang dapat digunakan dalam jangka panjang. Nomor akses yang unik menghubungkan sampel fisik dengan catatan asal, hasil uji, lokasi penyimpanan, dan riwayat pemindahan. Salinan data perlu dibuat secara berkala dan formatnya sebaiknya tidak bergantung pada satu perangkat atau satu orang. Tanpa pengelolaan data yang baik, benih mungkin tetap tersimpan secara fisik tetapi sulit ditemukan atau digunakan secara tepat.

Penggunaan koleksi juga perlu mengikuti prosedur yang jelas. Permintaan bahan dapat dicatat bersama tujuan penggunaan, jumlah yang dikirim, serta persyaratan pengiriman atau perbanyakan. Informasi ini membantu pengelola menelusuri pergerakan bahan dan memahami kebutuhan pengguna. Pengiriman tidak selalu dapat dipenuhi, misalnya ketika jumlah benih sangat terbatas atau kondisi sampel belum memenuhi standar. Penjelasan yang transparan dapat membantu menjaga kepercayaan antara pengelola dan pengguna.

Perpustakaan benih bukan satu-satunya cara menjaga keanekaragaman tanaman. Petani yang terus menanam dan memilih benih di lahan juga mempertahankan proses adaptasi yang berlangsung dalam kondisi nyata. Kebun koleksi, bank gen, jaringan pertukaran benih, dan praktik pertanian lokal dapat saling melengkapi. Penyimpanan terpusat membantu melindungi bahan dari kehilangan setempat, sedangkan penanaman berkelanjutan menjaga hubungan tanaman dengan lingkungan dan pengetahuan manusia. Ketahanan jangka panjang memerlukan kerja sama antara pengelola koleksi, peneliti, petani, dan komunitas yang memiliki keterkaitan dengan benih tersebut.`}

];
let db=loadDB(),state={screen:'intro',code:'',participant:null,order:null,trial:0,startedAt:null,readStart:null,readEnd:null,answers:{},distractorStart:null,taskCount:0,consent:false};
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{settings:{target:40,distractorSeconds:30,retention:false,registrationOpen:true},texts:defaultTexts,questions:questionBanks,participants:{},sequence:0,adminPin:'1234'}}catch(e){return {settings:{target:40,distractorSeconds:30,retention:false,registrationOpen:true},texts:defaultTexts,questions:questionBanks,participants:{},sequence:0,adminPin:'1234'}}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentTrial(){return state.participant?.trials?.[state.trial]}
function screen(html){document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
function progress(n){return `<div class="steps">${[0,1,2,3,4,5,6].map(i=>`<div class="step ${i<=n?'active':''}"></div>`).join('')}</div>`}
function saveParticipant(){if(state.participant){db.participants[state.code]=state.participant;saveDB()}}
function renderIntro(){state.screen='intro';screen(`<div class="card narrow"><span class="pill">Sebelum memulai</span><h1>Persetujuan Partisipasi</h1><p>Anda diundang mengikuti kegiatan yang melibatkan pembacaan materi dan menjawab pertanyaan. Keikutsertaan bersifat sukarela. Anda dapat berhenti kapan saja tanpa perlu memberikan alasan. Data akan menggunakan kode peserta, bukan nama lengkap.</p><p>Perkiraan waktu bergantung pada kecepatan membaca dan pengerjaan. Hindari membagikan kode peserta kepada orang lain. Jika ada pertanyaan mengenai prosedur atau penggunaan data, silakan hubungi peneliti yang bertanggung jawab.</p><p class="note"><b>Catatan prototipe:</b> data pada versi ini hanya disimpan di browser/perangkat ini. Data tidak otomatis terkirim kepada peneliti dan belum dilindungi autentikasi server.</p><label class="consent"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>Saya telah membaca informasi di atas, berusia sesuai persyaratan protokol, dan bersedia melanjutkan secara sukarela.</span></label><label class="field" for="code">Kode peserta anonim</label><input id="code" maxlength="40" autocomplete="off" placeholder="Masukkan kode dari peneliti" value="${esc(state.code)}"><div class="actions"><button id="start">Mulai</button></div><p id="introError" class="warning"></p></div>`);document.getElementById('consent').onchange=e=>state.consent=e.target.checked;document.getElementById('code').oninput=e=>state.code=e.target.value.trim();document.getElementById('start').onclick=startParticipant}
function startParticipant(){let err=document.getElementById('introError');state.code=state.code.trim();if(!state.consent){err.textContent='Mohon konfirmasi persetujuan terlebih dahulu.';return}if(!state.code){err.textContent='Masukkan kode peserta anonim.';return}if(!db.settings.registrationOpen&&!db.participants[state.code]){err.textContent='Pendaftaran sedang ditutup. Hubungi peneliti.';return}
 if(db.participants[state.code]){state.participant=db.participants[state.code];state.trial=state.participant.trialIndex||0;state.answers={};resumeParticipant();return}
 const counts=[0,0,0,0];Object.values(db.participants).forEach(p=>{if(p.orderIndex>=0&&p.orderIndex<4)counts[p.orderIndex]++});
 // Randomized block allocation in blocks of four; random order within each block.
 let available=[0,1,2,3];for(let i=available.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]]}
 let incomplete=Object.values(db.participants).filter(p=>p.blockOrders&&p.blockOrders.length).length;
 let orderIndex=available[(db.sequence)%4];db.sequence++;
 const orders=[
 [{text:'A',highlight:false},{text:'B',highlight:true}],
 [{text:'A',highlight:true},{text:'B',highlight:false}],
 [{text:'B',highlight:false},{text:'A',highlight:true}],
 [{text:'B',highlight:true},{text:'A',highlight:false}]
 ];
 state.order=orderIndex;state.trial=0;state.participant={code:state.code,orderIndex,orderLabel:['A','B','C','D'][orderIndex],trials:orders[orderIndex].map((t,i)=>({text:t.text,highlight:t.highlight,status:'belum',readStart:null,readEnd:null,readDuration:null,distractorStatus:'belum',distractorDuration:null,answers:null,score:null,startedAt:null,completedAt:null,highlights:[]})),trialIndex:0,status:'terdaftar',createdAt:new Date().toISOString(),consentAt:new Date().toISOString(),retentionStatus:db.settings.retention?'menunggu':'nonaktif',technicalNotes:[]};saveParticipant();renderInstructions()}
function resumeParticipant(){let p=state.participant;if(p.status==='selesai'){renderDone();return}if(!p.trials[state.trial])state.trial=0;const t=p.trials[state.trial];if(!t){renderDone();return}if(t.status==='tes_selesai'){state.trial++;p.trialIndex=state.trial;saveParticipant();if(state.trial>=2)renderDone();else renderInstructions();return}if(t.status==='membaca'){renderReading(true);return}if(t.status==='pengalih'){renderDistractor(true);return}if(t.status==='tes'){renderQuiz(true);return}renderInstructions()}
function renderInstructions(){state.screen='instructions';screen(`${progress(0)}<div class="card narrow"><h1>Petunjuk Pengerjaan</h1><ol><li>Ikuti petunjuk yang ditampilkan pada setiap tahap.</li><li>Bacalah materi yang tersedia dengan saksama.</li><li>Setelah menyelesaikan suatu tahap, tekan tombol Lanjut untuk berpindah ke tahap berikutnya.</li><li>Kerjakan setiap tugas secara mandiri.</li><li>Jawablah pertanyaan berdasarkan pemahaman dan ingatanmu sendiri.</li><li>Setelah berpindah dari halaman materi, kamu tidak dapat kembali ke halaman sebelumnya.</li><li>Jika mengalami kendala teknis, silakan hubungi peneliti atau pendamping yang bertugas.</li></ol><div class="actions"><button id="continue">Lanjut</button></div></div>`);document.getElementById('continue').onclick=()=>{state.participant.status='berlangsung';saveParticipant();renderReading(false)}}
function renderReading(resume){let t=currentTrial();if(!t)return renderDone();let textObj=db.texts[t.text];if(!t.readStart){t.readStart=new Date().toISOString();t.status='membaca';state.participant.status='berlangsung';saveParticipant()}state.readStart=t.readStart;
 let body=textObj.body.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('');
 screen(`${progress(state.trial?4:1)}<div class="card"><div class="pill">Materi ${state.trial+1} dari 2</div><h1>${esc(textObj.title)}</h1><p>${t.highlight?'Bacalah teks berikut dengan saksama. Kamu dapat menandai bagian teks menggunakan fitur yang tersedia. Tekan Lanjut setelah selesai membaca.':'Bacalah teks berikut dengan saksama. Tekan Lanjut setelah selesai membaca.'}</p>${t.highlight?'<p class="note">Untuk menandai, pilih teks lalu tekan tombol “Sorot pilihan”. Pada perangkat yang tidak mendukung seleksi dengan baik, kamu dapat memilih paragraf lalu menggunakan tombol yang sama.</p>':''}<div id="readingText" class="reading">${body}</div>${t.highlight?'<div class="actions" style="position:sticky;bottom:8px;background:#ffffffed;padding:8px;border-radius:12px"><button id="highlightBtn">Sorot pilihan</button><button id="clearHighlight" class="secondary">Hapus sorotan</button></div>':''}<div class="actions"><button id="readingNext">Lanjut</button></div><p id="readError" class="warning"></p></div>`);
 applyHighlights();
 if(t.highlight){document.getElementById('highlightBtn').onclick=addHighlight;document.getElementById('clearHighlight').onclick=clearHighlights}
 document.getElementById('readingNext').onclick=()=>{t.readEnd=new Date().toISOString();t.readDuration=Math.max(0,Math.round((Date.parse(t.readEnd)-Date.parse(t.readStart))/1000));t.status='dibaca';saveParticipant();state.participant.trialIndex=state.trial;saveParticipant();renderDistractor(false)}
}
function applyHighlights(){let t=currentTrial(),el=document.getElementById('readingText');if(!t||!el||!t.highlight)return;let marks=t.highlights||[];if(!marks.length)return;
 // Rebuild paragraph content from stored character ranges, maintaining original text order.
 let original=db.texts[t.text].body.split(/\n\n+/);let offset=0;el.innerHTML=original.map(p=>{let start=offset,end=offset+p.length;let local=marks.filter(m=>m.start<end&&m.end>start).map(m=>({s:Math.max(0,m.start-start),e:Math.min(p.length,m.end-start)})).sort((a,b)=>a.s-b.s);let out='',pos=0;local.forEach(m=>{if(m.s<pos)return;out+=esc(p.slice(pos,m.s))+`<mark style="background:#ffeb70;color:#202b36;border-radius:2px">${esc(p.slice(m.s,m.e))}</mark>`;pos=m.e});out+=esc(p.slice(pos));offset=end+2;return `<p>${out}</p>`}).join('')}
function addHighlight(){let sel=window.getSelection();if(!sel||sel.isCollapsed){document.getElementById('readError').textContent='Pilih kata, frasa, atau kalimat di teks terlebih dahulu.';return}let el=document.getElementById('readingText');if(!el.contains(sel.anchorNode)||!el.contains(sel.focusNode)){document.getElementById('readError').textContent='Pilihan harus berasal dari teks bacaan.';return}
 // Convert selection to offsets in the canonical source text using a temporary range.
 let range=sel.getRangeAt(0),pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(range.startContainer,range.startOffset);let start=pre.toString().length;let length=range.toString().length;let t=currentTrial();let canonical=db.texts[t.text].body;start=Math.max(0,Math.min(start,canonical.length));let end=Math.min(canonical.length,start+length);if(end<=start)return;t.highlights.push({start,end});t.highlights.sort((a,b)=>a.start-b.start); // merge overlaps
 let merged=[];t.highlights.forEach(m=>{let last=merged[merged.length-1];if(last&&m.start<=last.end)last.end=Math.max(last.end,m.end);else merged.push({...m})});t.highlights=merged;saveParticipant();sel.removeAllRanges();applyHighlights();document.getElementById('readError').textContent='Sorotan disimpan pada sesi di perangkat ini.'}
function clearHighlights(){if(!confirm('Hapus semua sorotan pada teks ini?'))return;currentTrial().highlights=[];saveParticipant();applyHighlights()}
function renderDistractor(resume){let t=currentTrial();t.status='pengalih';if(!t.distractorStart)t.distractorStart=new Date().toISOString();state.distractorStart=t.distractorStart;saveParticipant();let sec=Number(db.settings.distractorSeconds)||30;let elapsed=Math.floor((Date.now()-Date.parse(t.distractorStart))/1000);let left=Math.max(0,sec-elapsed);
 screen(`${progress(state.trial?5:2)}<div class="card narrow"><div class="pill">Kegiatan singkat</div><h1>Pencocokan Simbol</h1><p>Perhatikan simbol pada setiap baris. Pilih simbol yang sama dengan simbol contoh. Kerjakan secara mandiri sampai kegiatan selesai.</p><div class="note">Simbol contoh: <strong style="font-size:24px">○</strong></div><div id="symbolTask" class="grid" style="margin-top:14px">${Array.from({length:12},(_,i)=>{let arr=['△','◇','○','□','○','△','□','◇','○','□','△','◇'];return `<button class="secondary symbol" data-ok="${arr[i]==='○'}" style="font-size:24px">${arr[i]}</button>`}).join('')}</div><p>Terpilih: <b id="taskCount">${t.taskCount||0}</b></p><p class="muted">Kegiatan berakhir setelah durasi yang ditetapkan.</p><h2 id="timer">Sisa waktu: ${left} detik</h2><div class="actions"><button id="finishTask" disabled>Lanjut</button></div></div>`);
 let count=t.taskCount||0;document.querySelectorAll('.symbol').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.style.background=b.dataset.ok==='true'?'#dcebdc':'#f1e2e2';b.style.color='#202b36';count++;t.taskCount=count;saveParticipant();document.getElementById('taskCount').textContent=count});
 const interval=setInterval(()=>{let rem=Math.max(0,sec-Math.floor((Date.now()-Date.parse(t.distractorStart))/1000));let timer=document.getElementById('timer');if(timer)timer.textContent=rem?'Sisa waktu: '+rem+' detik':'Kegiatan selesai';if(rem<=0){clearInterval(interval);if(document.getElementById('finishTask'))document.getElementById('finishTask').disabled=false}},250);
 document.getElementById('finishTask').onclick=()=>{clearInterval(interval);t.distractorDuration=Math.max(0,Math.round((Date.now()-Date.parse(t.distractorStart))/1000));t.distractorStatus='selesai';t.status='tes';saveParticipant();renderQuiz(false)}
}
function renderQuiz(resume){let t=currentTrial();t.status='tes';saveParticipant();let qs=db.questions[t.text]||[];screen(`${progress(state.trial?6:3)}<div class="card"><div class="pill">Pertanyaan pemahaman</div><h1>Jawab berdasarkan ingatanmu</h1><p class="muted">Pilih satu jawaban untuk pertanyaan pilihan ganda. Untuk jawaban singkat, tuliskan jawabanmu sendiri. Kamu tidak dapat membuka kembali materi.</p><form id="quizForm">${qs.map((q,i)=>`<div class="q"><label>${i+1}. ${esc(q[0])}</label>${q[1]?q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" ${t.answers&&String(t.answers[i]?.raw)===String(j)?'checked':''}> <span>${esc(o)}</span></label>`).join(''):`<textarea name="q${i}" placeholder="Tulis jawaban singkat..." ${t.answers&&t.answers[i]?'':' '}>${esc(t.answers?.[i]?.raw||'')}</textarea>`}</div>`).join('')}<div class="actions"><button type="submit">Kirim jawaban</button></div><p id="quizError" class="warning"></p></form></div>`);
 document.getElementById('quizForm').onsubmit=e=>{e.preventDefault();let answers={},score=0,mc=0;for(let i=0;i<qs.length;i++){let q=qs[i],el=document.querySelector(`[name="q${i}"]:checked`)||document.querySelector(`[name="q${i}"]`);let raw=el?el.value.trim():'';if(raw===''){document.getElementById('quizError').textContent='Mohon jawab semua pertanyaan sebelum mengirim.';return}let pts=null;if(q[1]){pts=Number(raw)===q[2]?1:0;score+=pts;mc++}answers[i]={raw,correctKey:q[1]?q[2]:null,score:pts,question:q[0],rubric:q[1]?null:'Perlu diperiksa peneliti secara manual.'}}t.answers=answers;t.score={autoScore:score,maxAuto:mc,shortCount:qs.length-mc,manualReviewRequired:true};t.status='tes_selesai';t.completedAt=new Date().toISOString();saveParticipant();renderAfterQuiz()}
}
function renderAfterQuiz(){screen(`<div class="card narrow"><span class="pill">Tahap selesai</span><h1>Terima kasih</h1><p>Jawaban telah dicatat pada sesi ini. Tidak ada umpan balik benar atau salah yang ditampilkan.</p><div class="actions"><button id="nextTrial">Lanjut</button></div></div>`);document.getElementById('nextTrial').onclick=()=>{state.trial++;state.participant.trialIndex=state.trial;saveParticipant();if(state.trial>=2){state.participant.status='selesai';state.participant.completedAt=new Date().toISOString();saveParticipant();renderDone()}else renderInstructions()}}
function renderDone(){if(state.participant){state.participant.status='selesai';state.participant.completedAt=state.participant.completedAt||new Date().toISOString();saveParticipant()}screen(`<div class="card narrow"><h1>Terima kasih telah berpartisipasi</h1><p>Seluruh tahap utama telah selesai. Jika ada sesi lanjutan, peneliti akan memberikan informasi dan tautan yang sesuai.</p><p class="note">Kode peserta: <b>${esc(state.code)}</b>. Simpan kode ini jika peneliti meminta Anda kembali untuk sesi lanjutan.</p><div class="actions"><button class="secondary" id="newSession">Kembali ke awal</button></div></div>`);document.getElementById('newSession').onclick=()=>{state={screen:'intro',code:'',participant:null,order:null,trial:0,startedAt:null,readStart:null,readEnd:null,answers:{},distractorStart:null,taskCount:0,consent:false};renderIntro()}}
function admin(){let pin=prompt('Masukkan PIN demo peneliti (default: 1234). Ini bukan autentikasi aman.');if(pin===null)return;if(pin!==db.adminPin){alert('PIN tidak sesuai.');return}renderAdmin('overview')}
function renderAdmin(tab){state.screen='admin';let ps=Object.values(db.participants);let complete=ps.filter(p=>p.status==='selesai').length,started=ps.filter(p=>p.status==='berlangsung').length;screen(`<div class="card"><div class="top"><div><span class="pill">Mode demo lokal</span><h1>Dashboard Peneliti</h1><p class="muted">Data hanya berasal dari browser ini. PIN demo tidak melindungi database.</p></div><button class="secondary" id="exitAdmin">Keluar</button></div><div class="adminnav">${[['overview','Ringkasan'],['participants','Peserta'],['settings','Pengaturan'],['content','Materi & soal'],['export','Ekspor data']].map(([k,v])=>`<button class="${tab===k?'':'secondary'}" data-tab="${k}">${v}</button>`).join('')}</div><div id="adminContent" style="margin-top:20px"></div></div>`);document.getElementById('exitAdmin').onclick=renderIntro;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderAdmin(b.dataset.tab));let c=document.getElementById('adminContent');
 if(tab==='overview')c.innerHTML=`<div class="grid"><div class="stat"><span class="muted">Terdaftar</span><strong>${ps.length}</strong></div><div class="stat"><span class="muted">Mulai</span><strong>${ps.filter(p=>p.status!=='terdaftar').length}</strong></div><div class="stat"><span class="muted">Selesai</span><strong>${complete}</strong></div><div class="stat"><span class="muted">Belum selesai</span><strong>${ps.length-complete}</strong></div></div><p>Target: <b>${db.settings.target}</b> peserta · Pendaftaran: <b>${db.settings.registrationOpen?'dibuka':'ditutup'}</b></p><p class="note">Alokasi dalam demo ini disimpan lokal dan bukan randomisasi blok terpusat yang aman. Jangan gunakan untuk penelitian sebenarnya.</p>`;
 if(tab==='participants')c.innerHTML=`<div class="actions"><button id="addCode">Buat kode peserta</button><button id="closeReg" class="secondary">${db.settings.registrationOpen?'Tutup pendaftaran':'Buka pendaftaran'}</button><button id="clearData" class="danger">Hapus seluruh data demo</button></div><div class="tablewrap"><table><thead><tr><th>Kode</th><th>Status</th><th>Urutan</th><th>Teks/kondisi</th><th>Durasi baca (detik)</th><th>Skor otomatis</th><th>Retensi</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.status)}</td><td>${esc(p.orderLabel)}</td><td>${p.trials.map(t=>`${t.text} ${t.highlight?'stabilo':'tanpa'}`).join(' → ')}</td><td>${p.trials.map(t=>t.readDuration??'—').join(' / ')}</td><td>${p.trials.map(t=>t.score?.autoScore??'—').join(' / ')}</td><td>${esc(p.retentionStatus)}</td></tr>`).join('')}</tbody></table></div>`;
 if(tab==='settings')c.innerHTML=`<label class="field">Target peserta</label><input id="target" type="number" min="1" max="10000" value="${db.settings.target}"><label class="field">Durasi tugas pengalih perhatian (detik)</label><input id="duration" type="number" min="5" max="600" value="${db.settings.distractorSeconds}"><label class="field">Tes retensi tertunda</label><select id="retention"><option value="false" ${!db.settings.retention?'selected':''}>Nonaktif</option><option value="true" ${db.settings.retention?'selected':''}>Aktif (status saja; tautan/penjadwalan belum tersedia)</option></select><label class="field">Pendaftaran peserta</label><select id="reg"><option value="true" ${db.settings.registrationOpen?'selected':''}>Dibuka</option><option value="false" ${!db.settings.registrationOpen?'selected':''}>Ditutup</option></select><label class="field">PIN demo peneliti (tidak aman)</label><input id="pin" value="${esc(db.adminPin)}"><div class="actions"><button id="saveSettings">Simpan pengaturan</button></div>`;
 if(tab==='content')c.innerHTML=`<p>Editor teks (ubah teks dalam format paragraf; pisahkan paragraf dengan satu baris kosong).</p>${['A','B'].map(k=>`<h3>Teks ${k}</h3><label class="field">Judul</label><input id="title${k}" value="${esc(db.texts[k].title)}"><label class="field">Isi</label><textarea id="body${k}" style="min-height:250px">${esc(db.texts[k].body)}</textarea>`).join('')}<p>Bank soal saat ini: ${db.questions.A.length} soal Teks A dan ${db.questions.B.length} soal Teks B. Editor kunci/rubrik lanjutan belum tersedia pada demo ini.</p><div class="actions"><button id="saveContent">Simpan teks</button><button class="secondary" id="resetContent">Pulihkan teks demo</button></div>`;
 if(tab==='export')c.innerHTML=`<p>Unduh CSV berbentuk satu baris per peserta, kompatibel untuk impor ke Jamovi. Jawaban mentah pilihan ganda dan singkat disertakan dalam kolom JSON yang dikutip.</p><div class="actions"><button id="exportCsv">Unduh CSV</button><button class="secondary" id="exportJson">Unduh JSON cadangan</button><button class="secondary" id="importJson">Impor JSON cadangan</button></div><p class="note">CSV dapat berisi data sensitif meskipun memakai kode anonim. Simpan dengan akses terbatas.</p>`;
 if(tab==='participants'){document.getElementById('addCode').onclick=()=>{let code=prompt('Kode anonim baru:');if(!code)return;code=code.trim();if(!code)return;if(db.participants[code])return alert('Kode sudah ada.');if(Object.keys(db.participants).length>=Number(db.settings.target))return alert('Target tercapai. Ubah target terlebih dahulu jika protokol mengizinkan.');let temp={consent:true};state.code=code;state.consent=true;startParticipant();renderAdmin('participants')};document.getElementById('closeReg').onclick=()=>{db.settings.registrationOpen=!db.settings.registrationOpen;saveDB();renderAdmin('participants')};document.getElementById('clearData').onclick=()=>{if(confirm('Hapus semua data peserta lokal? Tindakan ini tidak dapat dibatalkan.')){db.participants={};db.sequence=0;saveDB();renderAdmin('participants')}}}
 if(tab==='settings')document.getElementById('saveSettings').onclick=()=>{db.settings.target=Math.max(1,Number(document.getElementById('target').value)||40);db.settings.distractorSeconds=Math.max(5,Math.min(600,Number(document.getElementById('duration').value)||30));db.settings.retention=document.getElementById('retention').value==='true';db.settings.registrationOpen=document.getElementById('reg').value==='true';db.adminPin=document.getElementById('pin').value||'1234';saveDB();alert('Pengaturan disimpan di browser ini.');renderAdmin('settings')};

 if(tab==='export'){document.getElementById('exportCsv').onclick=exportCSV;document.getElementById('exportJson').onclick=()=>download('ruang-studi-backup.json',JSON.stringify(db,null,2),'application/json');document.getElementById('importJson').onclick=()=>{let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let obj=JSON.parse(await inp.files[0].text());if(!obj.participants||!obj.settings)throw Error('Format tidak sesuai');if(confirm('Impor akan mengganti data lokal yang ada. Lanjutkan?')){db=obj;saveDB();renderAdmin('overview')}}catch(e){alert('Gagal mengimpor: '+e.message)}};inp.click()}}
}
function exportCSV(){let rows=[['code','status','order','created_at','completed_at','trial1_text','trial1_condition','trial1_read_start','trial1_read_end','trial1_read_duration_sec','trial1_distractor_duration_sec','trial1_answers_json','trial1_auto_score','trial1_manual_review','trial2_text','trial2_condition','trial2_read_start','trial2_read_end','trial2_read_duration_sec','trial2_distractor_duration_sec','trial2_answers_json','trial2_auto_score','trial2_manual_review','retention_status','technical_notes']];Object.values(db.participants).forEach(p=>{let a=p.trials[0]||{},b=p.trials[1]||{};rows.push([p.code,p.status,p.orderLabel,p.createdAt,p.completedAt,a.text,a.highlight?'stabilo':'tanpa',a.readStart,a.readEnd,a.readDuration,a.distractorDuration,JSON.stringify(a.answers||{}),a.score?.autoScore,a.score?.manualReviewRequired,b.text,b.highlight?'stabilo':'tanpa',b.readStart,b.readEnd,b.readDuration,b.distractorDuration,JSON.stringify(b.answers||{}),b.score?.autoScore,b.score?.manualReviewRequired,p.retentionStatus,JSON.stringify(p.technicalNotes||[])]);});let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download('ruang-studi-data.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('adminOpen').onclick=admin;window.addEventListener('popstate',()=>{if(state.screen==='reading'){alert('Navigasi kembali tidak dapat digunakan untuk membuka materi sebelumnya. Browser Back tidak dapat diblokir sepenuhnya.');renderReading(true)}else if(state.participant)resumeParticipant();else renderIntro()});history.pushState({page:1},'','#start');renderIntro();
</script></body></html>
